name: check

on:
  pull_request:
    branches:
      - ig/main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - ig/main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.7"
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Go modules
        run: go mod download

      - name: Check types
        run: cd platform && bun tsc --noEmit

      - name: Platform tests
        run: cd platform && bun x vitest run

      - name: Build platform
        run: ./platform/scripts/build
        env:
          SKIP_BRIDGE_TASK: "1"

      - name: Run Go tests
        run: go test -vet=all ./...

      - name: Build CLI
        run: go build -o sst ./cmd/sst
