name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-ig.*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # id-token: npm trusted publishing (OIDC); no npm token is stored.
  id-token: write
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.7"
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: TypeScript check
        run: cd platform && bun tsc --noEmit

      - name: Platform tests
        run: cd platform && bun x vitest run

      - name: Build platform
        run: ./platform/scripts/build
        env:
          SKIP_BRIDGE_TASK: "1"

      - name: Run Go tests
        run: go test -vet=all ./...

      - name: Release CLI
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Release JS SDK
        run: |
          cd sdk/js
          bun run release
