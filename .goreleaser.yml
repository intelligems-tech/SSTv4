version: 2
project_name: sst
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    main: ./cmd/sst

archives:
  - formats:
      - tar.gz
    name_template: >-
      sst-
      {{- if eq .Os "darwin" }}mac-
      {{- else if eq .Os "windows" }}windows-
      {{- else if eq .Os "linux" }}linux-{{end}}
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "#86" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"
# The fork publishes GitHub release assets and npm packages only; the AUR,
# Homebrew and deb/rpm channels of upstream are not maintained here.

changelog:
  use: git
  format: "[{{ .SHA }}](https://github.com/intelligems-io/sst/commit/{{ .SHA }}): {{ .Message }}"
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^doc:"
      - "^test:"
      - "^ci:"
      - "^ignore:"
      - "^example:"
      - "^wip:"
